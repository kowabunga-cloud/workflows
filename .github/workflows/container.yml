name: (reusable) Container Image

# Builds a multi-platform container image and scans it for vulnerabilities.
# When a release version is given, the image is also published to GitHub
# Container Registry (ghcr.io/<owner>/<image>), with SBOM and provenance
# attestations, and signed (Sigstore keyless signing).
#
# Publishing requires the caller to grant the following permissions:
#   contents: read, packages: write, id-token: write, attestations: write

on:
  workflow_call:
    inputs:
      image:
        description: Image name, published as ghcr.io/<owner>/<image>
        required: true
        type: string
      version:
        description: >-
          Released version (x.y.z), image is only built and scanned if
          unspecified
        required: false
        type: string
        default: ''
      ref:
        description: Git reference to build (defaults to the triggering one)
        required: false
        type: string
        default: ''
      description:
        description: Image description (OCI label)
        required: false
        type: string
        default: ''
      platforms:
        required: false
        type: string
        default: linux/amd64,linux/arm64
      context:
        required: false
        type: string
        default: .
      file:
        required: false
        type: string
        default: Dockerfile

jobs:
  image:
    name: Container image
    runs-on: ubuntu-26.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
      PUBLISH: ${{ inputs.version != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # yamllint disable rule:line-length
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ env.PUBLISH }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ env.PUBLISH }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ env.PUBLISH }}
            type=raw,value=latest,enable=${{ env.PUBLISH }}
            type=sha,enable=${{ env.PUBLISH != 'true' }}
          labels: |
            org.opencontainers.image.vendor=The Kowabunga Project
            org.opencontainers.image.documentation=https://www.kowabunga.cloud/docs/
            ${{ inputs.description != '' && format('org.opencontainers.image.description={0}', inputs.description) || '' }}
          annotations: |
            ${{ inputs.description != '' && format('org.opencontainers.image.description={0}', inputs.description) || '' }}
      # yamllint enable rule:line-length

      # vulnerability scan of the runner platform image, before anything gets
      # published: fixable high and critical vulnerabilities fail the build
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          build-args: VERSION=${{ inputs.version || 'dev' }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Scan image
        # v0.36.0, pinned by commit as trivy-action tags got compromised in
        # the past
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-platform image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ inputs.version || 'dev' }}
          # SBOM and SLSA provenance attestations, attached to the image index
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Install Cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@v4

      - name: Sign image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # keyless signing, using the workflow OIDC identity
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # yamllint disable rule:line-length
      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ${IMAGE}@${DIGEST}"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "Verify with:"
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY_OWNER}/'"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --owner ${GITHUB_REPOSITORY_OWNER}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # yamllint enable rule:line-length
