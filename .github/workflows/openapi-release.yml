name: (reusable) Trigger OpenAPI Release

on:
  workflow_call:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-26.04
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # required by the specification build, run at release preparation
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Release
        id: semantic
        uses: kowabunga-cloud/workflows/.github/actions/semantic-release@v1
        with:
          app-id: ${{ vars.KOWABUNGA_BOT_APP_ID }}
          private-key: ${{ secrets.KOWABUNGA_BOT_PRIVATE_KEY }}
