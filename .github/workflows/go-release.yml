name: (reusable) Trigger Go Release

on:
  workflow_call:
    inputs:
      pkgs:
        required: false
        type: string
      image:
        description: >-
          Container image to publish (ghcr.io/<owner>/<image>), none if
          unspecified
        required: false
        type: string
        default: ''
      image-description:
        description: Container image description
        required: false
        type: string
        default: ''

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-26.04
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # only release commits which passed all checks
      - name: Wait for CI
        uses: kowabunga-cloud/workflows/.github/actions/wait-for-ci@v1

      - name: Release
        id: semantic
        uses: kowabunga-cloud/workflows/.github/actions/semantic-release@v1
        with:
          app-id: ${{ vars.KOWABUNGA_BOT_APP_ID }}
          private-key: ${{ secrets.KOWABUNGA_BOT_PRIVATE_KEY }}

  build:
    if: needs.release.outputs.new_release_published == 'true'
    needs: release
    name: Multiarch builds
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # release packages target Ubuntu 26.04 LTS (resolute): build them on
        # it, so that they match its system libraries
        include:
          - os: ubuntu-26.04
            arch: amd64
            version: resolute
          - os: ubuntu-26.04-arm
            arch: arm64
            version: resolute

    steps:
      - name: Update packages
        run: sudo apt-get update
      - name: Install package dependencies
        run: sudo apt-get install -y debhelper ${{ inputs.pkgs }}
      - uses: actions/checkout@v7
      - name: Find out Go version
        # latest patch release of the go.mod language version
        run: |
          v=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)
          echo "GO_VERSION=${v}" >> "$GITHUB_ENV"
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: make all PROD=1 VERSION="${VERSION}"
      - name: Build Debian package
        run: |
          DIST=${{ matrix.version }} \
          RELEASE=${{ needs.release.outputs.new_release_version }} ./debian.sh
      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: |
            ../*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    if: >-
      needs.release.outputs.new_release_published == 'true' &&
      inputs.image != ''
    needs: release
    name: Container image
    # requires the caller to grant packages: write, id-token: write and
    # attestations: write permissions
    uses: kowabunga-cloud/workflows/.github/workflows/container.yml@v1
    with:
      image: ${{ inputs.image }}
      description: ${{ inputs.image-description }}
      version: ${{ needs.release.outputs.new_release_version }}
      ref: v${{ needs.release.outputs.new_release_version }}

  publish:
    if: needs.release.outputs.new_release_published == 'true'
    name: Trigger packages publishing
    needs: [release, build]
    runs-on: ubuntu-26.04
    steps:
      - name: Trigger APT repository update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: '${{ secrets.PAT_PACKAGES_WORKFLOW_TOKEN }}'
          repository: kowabunga-cloud/packages
          event-type: Publish-Deb
