name: (reusable) Go Vulnerabilities Check

on:
  workflow_call:
    inputs:
      pkgs:
        required: false
        type: string

jobs:
  govulncheck:
    name: Run vulnerability checks
    runs-on: ubuntu-26.04

    steps:
      - name: Update packages
        run: sudo apt-get update
      - name: Install package dependencies
        run: sudo apt-get install -y debhelper ${{ inputs.pkgs }}
      - uses: actions/checkout@v7
      - name: Find out Go version
        # latest patch release of the go.mod language version
        run: |
          v=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)
          echo "GO_VERSION=${v}" >> "$GITHUB_ENV"
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Run GoVulnCheck security scanner
        run: make vuln
